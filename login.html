
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | CODERWANDA Ltd</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{min-height:100vh;background:linear-gradient(135deg,#092e55,#147bb5);
display:flex;justify-content:center;align-items:center;padding:25px}
.login-card{background:white;width:100%;max-width:430px;padding:42px;
border-radius:15px;box-shadow:0 15px 45px #001b383d}
.logo{text-align:center;color:#1264a3;font-size:24px;font-weight:800}
.logo span{color:#1596d2}
h2{text-align:center;color:#17395e;margin-top:28px;font-size:28px}
.subtitle{text-align:center;color:#7a8797;margin:12px 0 30px;font-size:14px}
label{display:block;font-weight:600;color:#34475d;margin:17px 0 9px;font-size:14px}
input{width:100%;padding:14px;border:1px solid #d7e0e9;border-radius:7px;
outline:none;font-size:15px}
input:focus{border-color:#1596d2;box-shadow:0 0 0 3px #1596d21a}
button{width:100%;margin-top:25px;padding:15px;border:0;border-radius:7px;
background:#1264a3;color:white;font-weight:bold;font-size:16px;cursor:pointer}
button:hover{background:#092e55}
.bottom{text-align:center;margin-top:23px;color:#758397;font-size:14px;line-height:2}
a{color:#1264a3;text-decoration:none;font-weight:bold}
.home{text-align:center;margin-top:22px}
</style>
</head>
<body>

<div class="login-card">
    <div class="logo">CODER<span>WANDA</span> Ltd.</div>

    <h2>Welcome Back!</h2>
    <p class="subtitle">Login to access your account</p>

    <form id="loginForm">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>

        <button type="submit">Sign In →</button>
    </form>

    <div class="bottom">
        Don't have an account? <a href="registration.html">Create Account</a>
    </div>

    <div class="home">
        <a href="index.html">← Back to Home</a>
    </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit",function(e){
    e.preventDefault();
    alert("Demo only: Connect a backend to authenticate users.");
});
</script>
</body>
</html>
